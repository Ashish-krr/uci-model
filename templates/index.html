<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-4xl w-full bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Heart Disease Risk Assessment</h1>
            <p class="text-gray-500 mt-2">Enter patient vitals and test results to predict disease presence.</p>
        </div>

        <form action="{{ url_for('predict') }}" method="post" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Age</label>
                    <input type="number" name="age" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Resting BP (trestbps)</label>
                    <input type="number" name="trestbps" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cholesterol (chol)</label>
                    <input type="number" name="chol" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Max Heart Rate (thalach)</label>
                    <input type="number" name="thalach" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ST Depression (oldpeak)</label>
                    <input type="number" step="0.1" name="oldpeak" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Major Vessels (ca: 0-3)</label>
                    <input type="number" name="ca" min="0" max="3" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Sex</label>
                    <select name="sex" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="1">Male (1)</option>
                        <option value="0">Female (0)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Chest Pain Type (cp)</label>
                    <select name="cp" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="1">Type 1</option>
                        <option value="2">Type 2</option>
                        <option value="3">Type 3</option>
                        <option value="4">Type 4</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Fasting Blood Sugar > 120 (fbs)</label>
                    <select name="fbs" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="0">False (0)</option>
                        <option value="1">True (1)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Resting ECG (restecg)</label>
                    <select name="restecg" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="0">Normal (0)</option>
                        <option value="1">Abnormality (1)</option>
                        <option value="2">Hypertrophy (2)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Exercise Angina (exang)</label>
                    <select name="exang" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="0">No (0)</option>
                        <option value="1">Yes (1)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Slope</label>
                    <select name="slope" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="1">Upsloping (1)</option>
                        <option value="2">Flat (2)</option>
                        <option value="3">Downsloping (3)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Thalassemia (thal)</label>
                    <select name="thal" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                        <option value="3">Normal (3)</option>
                        <option value="6">Fixed Defect (6)</option>
                        <option value="7">Reversable Defect (7)</option>
                    </select>
                </div>
            </div>

            <div class="mt-8">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Analyze Patient Data
                </button>
            </div>
        </form>

        {% if prediction_text %}
        <div class="mt-8 p-4 rounded-md {% if 'High' in prediction_text %} bg-red-50 text-red-800 border border-red-200 {% else %} bg-green-50 text-green-800 border border-green-200 {% endif %} text-center text-xl font-semibold">
            Result: {{ prediction_text }}
        </div>
        {% endif %}
    </div>
</body>
</html>
